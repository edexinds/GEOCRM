<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>EDEX | CRM Geográfico</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0b1120;
    --navy2:#101a30;
    --panel:#0f1830;
    --grid:rgba(255,255,255,0.06);
    --line:rgba(255,255,255,0.12);
    --orange:#f7941d;
    --blue:#00aeef;
    --text:#e9edf5;
    --muted:#93a0b8;
    --danger:#ef4444;
    --ok:#22c55e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:var(--navy);
    color:var(--text);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:28px 28px;
  }
  #root{height:100vh;height:calc(var(--vh, 1vh) * 100);height:100dvh;display:flex;flex-direction:column;}
  header{
    display:flex;align-items:center;gap:14px;
    padding:10px 16px;
    background:linear-gradient(90deg, var(--navy2), var(--panel));
    border-bottom:1px solid var(--line);
    z-index:20;
    flex-wrap:wrap;
  }
  header img{height:34px;}
  .cloud-badge{
    font-size:11px;padding:3px 9px;border-radius:20px;
    border:1px solid var(--line);color:var(--muted);
  }
  .cloud-badge.ok{color:var(--ok);border-color:var(--ok);}
  .tabs{display:flex;gap:6px;margin-left:8px;}
  .tab-btn{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;
  }
  .tab-btn.active{background:var(--orange);color:#1a1206;border-color:var(--orange);}
  .spacer{flex:1;}
  select, input, textarea{
    background:var(--navy2);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:7px 9px;font-size:13px;
  }
  select:focus,input:focus,textarea:focus{outline:1px solid var(--blue);}
  button{font-family:inherit;}
  .btn{
    background:var(--blue);color:#04141c;border:none;border-radius:8px;
    padding:8px 14px;font-weight:700;cursor:pointer;font-size:13px;
  }
  .btn.secondary{background:transparent;color:var(--text);border:1px solid var(--line);}
  .btn.orange{background:var(--orange);color:#1a1206;}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  main{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;}
  #map{position:absolute;inset:0;background:var(--navy);touch-action:none;}
  .leaflet-container{background:var(--navy);width:100%;height:100%;touch-action:none;}

  .fab-add{
    position:fixed;bottom:22px;right:22px;z-index:900;
    display:flex;flex-direction:column;gap:8px;align-items:flex-end;
  }
  .fab-menu{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.5);overflow:hidden;min-width:220px;
  }
  .fab-menu button{
    width:100%;text-align:left;background:transparent;border:none;color:var(--text);
    padding:12px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;
  }
  .fab-menu button:last-child{border-bottom:none;}
  .fab-menu button:hover{background:var(--navy2);}
  .fab-main{
    width:56px;height:56px;border-radius:50%;background:var(--orange);color:#1a1206;
    border:none;font-size:26px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;
  }

  .sidebar{
    width:340px;min-width:340px;min-height:0;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;
    transition:width .22s ease, min-width .22s ease, opacity .18s ease, transform .22s ease;
  }
  .sidebar.is-hidden{width:0;min-width:0;opacity:0;border-right:none;pointer-events:none;}
  .sidebar-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;border-bottom:1px solid var(--line);flex-shrink:0;
  }
  .sidebar-header h4{margin:0;font-size:14px;}
  .sidebar-header button{background:transparent;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;}
  .route-sidebar-footer{
    padding:12px;border-top:1px solid var(--line);flex-shrink:0;background:var(--panel);
  }
  .route-sidebar-footer button{width:100%;}
  .route-sidebar-footer .hint2{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;}
  .sidebar-backdrop{display:none;}
  .sidebar .filters{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;}
  .filters .row{display:flex;gap:8px;}
  .filters select{flex:1;}
  .prospect-list{flex:1;min-height:0;overflow-y:auto;}
  .login-screen{
    height:100%;width:100%;display:flex;align-items:center;justify-content:center;
    padding:16px;
  }
  .login-card{
    width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5);
    display:flex;flex-direction:column;gap:4px;
  }
  .login-logo{height:40px;align-self:center;margin-bottom:10px;}
  .login-card h2{margin:0;font-size:18px;text-align:center;}
  .login-sub{margin:4px 0 18px;font-size:12px;color:var(--muted);text-align:center;}
  .login-card label{font-size:12px;color:var(--muted);margin:10px 0 5px;font-weight:600;}
  .login-card input{width:100%;}
  .login-pass-row{display:flex;gap:6px;align-items:center;}
  .login-pass-row input{flex:1;}
  .login-eye{
    background:transparent;border:1px solid var(--line);border-radius:6px;
    padding:7px 10px;cursor:pointer;font-size:14px;color:var(--text);
  }
  .login-error{color:var(--danger);font-size:12px;margin-top:10px;font-weight:600;}
  .login-submit{width:100%;margin-top:18px;padding:11px 14px;font-size:14px;}
  .user-badge{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .user-badge button{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;
  }
  .user-badge button:hover{color:var(--text);border-color:var(--text);}

  .sidebar-toggle-pill{
    position:absolute;top:12px;left:12px;z-index:1200;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:9px 14px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
  }
  /* deja espacio a la izquierda para que el botón de mostrar panel no choque con los controles de zoom de Leaflet */
  .leaflet-top.leaflet-left{margin-top:56px;}

  @media (max-width: 768px){
    header{padding:8px 10px;gap:6px 8px;flex-wrap:wrap;}
    header img{height:26px;}
    .cloud-badge{font-size:10px;padding:2px 7px;}
    .tabs{order:2;width:100%;margin-left:0;}
    .spacer{display:none;}
    .header-tools{
      order:3;width:100%;display:flex;flex-wrap:nowrap;gap:6px;
      overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;
    }
    .header-tools::-webkit-scrollbar{height:4px;}
    .header-tools select, .header-tools .btn{flex:0 0 auto;white-space:nowrap;}
    header select{font-size:12px;padding:6px 7px;}
    .fab-add{bottom:16px;right:14px;}
    .fab-main{width:52px;height:52px;font-size:24px;}
    .modal{max-height:94vh;}
    .modal-body{padding:14px;gap:10px;}
    .sidebar{
      position:absolute;top:0;left:0;height:100%;z-index:26;
      width:86vw;max-width:340px;min-width:0;
      box-shadow:0 0 40px rgba(0,0,0,.65);
      transform:translateX(0);
    }
    .sidebar.is-hidden{
      width:86vw;max-width:340px;opacity:1;
      transform:translateX(-105%);
    }
    .sidebar-backdrop{
      display:block;position:absolute;inset:0;z-index:25;
      background:rgba(0,0,0,.45);
      opacity:1;transition:opacity .22s ease;
    }
    .sidebar-backdrop.is-hidden{opacity:0;pointer-events:none;}
  }
  .prospect-item{
    padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .prospect-item:hover{background:var(--navy2);}
  .prospect-item .nombre{font-weight:700;font-size:14px;}
  .prospect-item .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .pill{
    display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-top:6px;font-weight:700;
  }

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;
    display:flex;align-items:center;justify-content:center;padding:16px;
  }
  .modal{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .modal-header{
    padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
  }
  .modal-header h3{margin:0;font-size:16px;}
  .modal-header button{background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;}
  .modal-body{padding:16px;display:flex;flex-direction:column;gap:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  .field input, .field select, .field textarea{width:100%;}
  .modal-footer{padding:14px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

  .toggle-group{display:flex;gap:8px;}
  .toggle-group button{
    flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--navy2);
    color:var(--muted);cursor:pointer;font-size:13px;
  }
  .toggle-group button.active{border-color:var(--orange);color:var(--orange);background:rgba(247,148,29,.1);}

  .visit-item{background:var(--navy2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;margin-top:6px;}
  .visit-item .fecha{color:var(--muted);}

  .action-row{display:flex;gap:8px;}
  .action-row a, .action-row button{flex:1;text-align:center;text-decoration:none;font-size:12px;}

  .dashboard{flex:1;overflow-y:auto;padding:22px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;}
  .card .num{font-size:28px;font-weight:800;}
  .card .lbl{font-size:12px;color:var(--muted);margin-top:4px;}
  .dash-block{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;}
  .dash-block h4{margin:0 0 10px 0;font-size:14px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;}
  .bar-row .bar-lbl{width:130px;color:var(--muted);flex-shrink:0;}
  .bar-track{flex:1;background:var(--navy2);border-radius:6px;height:14px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--blue);}
  .bar-row .bar-num{width:26px;text-align:right;font-weight:700;}

  .list-view{flex:1;overflow-y:auto;padding:14px;}
  .list-table{width:100%;border-collapse:collapse;font-size:13px;}
  .list-table th{text-align:left;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--navy);}
  .list-table td{padding:8px;border-bottom:1px solid var(--grid);}
  .list-table tr:hover{background:var(--navy2);cursor:pointer;}

  .pending-note{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:15;
    background:var(--orange);color:#1a1206;padding:8px 16px;border-radius:20px;
    font-size:13px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.4);
  }
  .hint{font-size:11px;color:var(--muted);}

  .report-banner{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:16;
    background:linear-gradient(90deg,#f7941d,#ffb347);color:#1a1206;
    padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;
    box-shadow:0 8px 24px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;
    max-width:92vw;flex-wrap:wrap;justify-content:center;
  }
  .report-banner button{border:none;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;}
  .report-banner .rb-send{background:#1a1206;color:#fff;}
  .report-banner .rb-dismiss{background:transparent;color:#1a1206;border:1px solid rgba(0,0,0,.3);}

  .route-toggle{display:flex;align-items:center;gap:6px;}
  .route-checkbox{
    width:18px;height:18px;border-radius:4px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    font-size:12px;color:#fff;
  }
  .route-checkbox.checked{background:var(--orange);border-color:var(--orange);color:#1a1206;}
  .prospect-item.route-mode{display:flex;align-items:flex-start;gap:10px;}
  .prospect-item.route-mode .info{flex:1;min-width:0;}

  .route-fab{
    position:fixed;bottom:22px;left:22px;z-index:900;
    background:var(--blue);color:#04141c;border:none;border-radius:10px;
    padding:12px 16px;font-weight:700;font-size:13px;cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,.5);
  }
  .route-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;}
  .route-stop{
    background:var(--navy2);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;display:flex;gap:10px;align-items:flex-start;
  }
  .route-stop .num{
    width:24px;height:24px;border-radius:50%;background:var(--orange);color:#1a1206;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0;
  }
  .route-stop .body{flex:1;min-width:0;}
  .route-stop .nom{font-weight:700;font-size:13px;}
  .route-stop .dist{font-size:12px;color:var(--muted);margin-top:2px;}
  .route-total{
    background:var(--navy2);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;
  }
  .route-numbered-icon{
    background:var(--orange);color:#1a1206;border-radius:50%;width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;
    border:2px solid #1a1206;box-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  .route-origin-icon{
    background:#22c55e;color:#04220f;border-radius:50%;width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;font-size:16px;
    border:2px solid #04220f;box-shadow:0 2px 8px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
<script>
  // Fix del alto real del viewport en móvil (la barra de direcciones no cuenta como 100vh)
  function setRealVH(){
    document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
  }
  setRealVH();
  window.addEventListener('resize', setRealVH);
  window.addEventListener('orientationchange', setRealVH);
</script>
<div id="root"></div>

/* ---------- HELPERS ---------- */
function uid(){ return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function fmtDate(ts){
  if(!ts) return "";
  const d = new Date(ts);
  return d.toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' +
         d.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
}
function hexIconSvg(color, icon){
  return `
    <svg width="38" height="38" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <polygon points="50,4 91,27 91,73 50,96 9,73 9,27"
        fill="${color}" stroke="#0b1120" stroke-width="4"/>
      <text x="50" y="60" font-size="34" text-anchor="middle" fill="#0b1120">${icon}</text>
    </svg>`;
}
function makeDivIcon(prospecto){
  const info = tipoInfo(prospecto.tipo);
  const icon = interesIcon(prospecto.interes);
  return L.divIcon({
    html: hexIconSvg(info.color, icon),
    className: 'edex-marker',
    iconSize: [38,38],
    iconAnchor: [19,19],
    popupAnchor: [0,-16]
  });
}

/* ---------- EXPORT A EXCEL ---------- */
function exportProspectosToExcel(prospectos){
  if(typeof XLSX === 'undefined'){ alert('No se pudo cargar el módulo de Excel. Revisa tu conexión.'); return; }
  const rows = prospectos.map(p=>{
    const historial = (p.visitas||[])
      .slice().reverse()
      .map(v=> `${fmtDate(v.fecha)} (${v.responsable}): ${v.nota||'sin nota'}`)
      .join(' | ');
    return {
      "Tipo": tipoInfo(p.tipo).label,
      "Nombre / Empresa": p.nombre || '',
      "Dirección": p.direccion || '',
      "Distrito": p.distrito || '',
      "Interés": (INTERESES.find(i=>i.id===p.interes)||{}).label || '',
      "Etapa comercial": etapaInfo(p.etapa).label,
      "Responsable": p.responsable || 'Sin asignar',
      "Próxima acción": p.proximaAccion || '',
      "Notas / Comentarios": p.notas || '',
      "Cantidad de visitas": (p.visitas||[]).length,
      "Historial de visitas": historial,
      "Latitud": typeof p.lat==='number' ? p.lat : '',
      "Longitud": typeof p.lng==='number' ? p.lng : '',
      "Fecha de creación": p.creadoEn ? fmtDate(p.creadoEn) : '',
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [
    {wch:10},{wch:26},{wch:26},{wch:16},{wch:16},{wch:16},{wch:14},
    {wch:14},{wch:34},{wch:10},{wch:50},{wch:12},{wch:12},{wch:16}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Prospectos");
  const now = new Date();
  const fname = `EDEX_reporte_clientes_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}.xlsx`;
  XLSX.writeFile(wb, fname);
}

/* ---------- AVISO DE REPORTE MENSUAL (día 30, o lunes siguiente si cae fin de semana) ---------- */
function getReportTriggerDate(year, monthIndex){
  const lastDayOfMonth = new Date(year, monthIndex+1, 0).getDate();
  const targetDay = Math.min(30, lastDayOfMonth);
  let d = new Date(year, monthIndex, targetDay);
  const dow = d.getDay(); // 0=domingo,6=sábado
  if(dow === 6) d = new Date(year, monthIndex, targetDay+2); // sábado -> lunes
  if(dow === 0) d = new Date(year, monthIndex, targetDay+1); // domingo -> lunes
  return d;
}
function isReportDueToday(){
  const today = new Date();
  const trigger = getReportTriggerDate(today.getFullYear(), today.getMonth());
  return today.getFullYear()===trigger.getFullYear() &&
         today.getMonth()===trigger.getMonth() &&
         today.getDate()===trigger.getDate();
}
function reportDismissKey(){
  const today = new Date();
  return `edex_report_dismissed_${today.getFullYear()}_${today.getMonth()+1}`;
}

/* ---------- RUTA VIAL (OSRM) ---------- */
function haversineKm(lat1,lon1,lat2,lon2){
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
async function fetchOptimizedRoute(origin, stops){
  // origin: {lat,lng}; stops: [{id,lat,lng,nombre,distrito}, ...]
  const coordsList = [origin, ...stops];
  const coordStr = coordsList.map(c=>`${c.lng},${c.lat}`).join(';');
  const url = `https://router.project-osrm.org/trip/v1/driving/${coordStr}?source=first&roundtrip=false&geometries=geojson&overview=full`;
  const res = await fetch(url);
  const data = await res.json();
  if(data.code !== 'Ok' || !data.trips || !data.trips.length){
    throw new Error(data.message || 'No se pudo calcular la ruta vial.');
  }
  const trip = data.trips[0];
  const waypoints = data.waypoints;
  const withIndex = coordsList.map((c,i)=>({...c, tripIndex: waypoints[i].waypoint_index}));
  withIndex.sort((a,b)=>a.tripIndex - b.tripIndex);
  const orderedStops = withIndex.slice(1); // sin el origen
  return {
    orderedStops,
    legs: trip.legs,
    geometry: trip.geometry.coordinates, // [[lng,lat], ...]
    totalKm: trip.distance/1000,
    totalMin: trip.duration/60
  };
}


async function geocodeAddress(query){
  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=pe&q=" +
    encodeURIComponent(query + ", Lima, Perú");
  const res = await fetch(url, {headers:{"Accept-Language":"es"}});
  const data = await res.json();
  if(data && data.length){
    return {lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), display: data[0].display_name};
  }
  return null;
}
async function reverseGeocode(lat,lng){
  try{
    const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`;
    const res = await fetch(url, {headers:{"Accept-Language":"es"}});
    const data = await res.json();
    return data && data.display_name ? data.display_name : "";
  }catch(e){ return ""; }
}

/* ---------- MAP COMPONENT ---------- */
function MapView({prospectos, onMapClick, pendingPoint, selectedId, onSelect, resizeSignal, routeResult, routeOrigin}){
  const mapRef = useRef(null);
  const leafletMap = useRef(null);
  const markersLayer = useRef(null);
  const pendingMarker = useRef(null);
  const routeLayer = useRef(null);

  useEffect(()=>{
    if(leafletMap.current) return;
    const map = L.map(mapRef.current, {zoomControl:true}).setView(LIMA_CENTER, 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution:'&copy; OpenStreetMap',
      maxZoom: 19
    }).addTo(map);
    markersLayer.current = L.layerGroup().addTo(map);
    routeLayer.current = L.layerGroup().addTo(map);
    map.on('click', (e)=> onMapClick(e.latlng.lat, e.latlng.lng));
    leafletMap.current = map;
    setTimeout(()=>map.invalidateSize(), 200);
  },[]);

  useEffect(()=>{
    if(!markersLayer.current) return;
    markersLayer.current.clearLayers();
    prospectos.forEach(p=>{
      if(typeof p.lat !== 'number' || typeof p.lng !== 'number') return;
      const marker = L.marker([p.lat,p.lng], {icon: makeDivIcon(p)});
      marker.on('click', ()=> onSelect(p.id));
      marker.bindTooltip(p.nombre || "Sin nombre", {direction:'top', offset:[0,-16]});
      marker.addTo(markersLayer.current);
    });
  },[prospectos]);

  useEffect(()=>{
    if(!leafletMap.current) return;
    if(pendingMarker.current){
      leafletMap.current.removeLayer(pendingMarker.current);
      pendingMarker.current = null;
    }
    if(pendingPoint){
      pendingMarker.current = L.marker([pendingPoint.lat, pendingPoint.lng], {
        icon: L.divIcon({
          html: hexIconSvg('#f7941d','+'),
          className:'edex-marker-pending', iconSize:[38,38], iconAnchor:[19,19]
        })
      }).addTo(leafletMap.current);
    }
  },[pendingPoint]);

  useEffect(()=>{
    if(!leafletMap.current || !selectedId) return;
    const p = prospectos.find(x=>x.id===selectedId);
    if(p && typeof p.lat==='number'){
      leafletMap.current.setView([p.lat,p.lng], Math.max(leafletMap.current.getZoom(),15), {animate:true});
    }
  },[selectedId]);

  useEffect(()=>{
    if(!leafletMap.current) return;
    // el ancho del mapa cambia al mostrar/ocultar el panel de prospectos
    const t1 = setTimeout(()=>leafletMap.current.invalidateSize(), 50);
    const t2 = setTimeout(()=>leafletMap.current.invalidateSize(), 320);
    return ()=>{ clearTimeout(t1); clearTimeout(t2); };
  },[resizeSignal]);

  useEffect(()=>{
    const onResize = ()=>{ if(leafletMap.current) leafletMap.current.invalidateSize(); };
    window.addEventListener('resize', onResize);
    return ()=> window.removeEventListener('resize', onResize);
  },[]);

  useEffect(()=>{
    if(!leafletMap.current || !routeLayer.current) return;
    routeLayer.current.clearLayers();
    if(!routeResult) return;

    if(routeOrigin){
      L.marker([routeOrigin.lat, routeOrigin.lng], {
        icon: L.divIcon({html:'<div class="route-origin-icon">🧭</div>', className:'', iconSize:[30,30], iconAnchor:[15,15]})
      }).bindTooltip('Tu ubicación', {direction:'top'}).addTo(routeLayer.current);
    }
    routeResult.orderedStops.forEach((s,idx)=>{
      L.marker([s.lat, s.lng], {
        icon: L.divIcon({html:`<div class="route-numbered-icon">${idx+1}</div>`, className:'', iconSize:[26,26], iconAnchor:[13,13]})
      }).bindTooltip(`${idx+1}. ${s.nombre||''}`, {direction:'top'}).addTo(routeLayer.current);
    });
    if(routeResult.geometry && routeResult.geometry.length){
      const latlngs = routeResult.geometry.map(c=>[c[1],c[0]]);
      L.polyline(latlngs, {color:'#f7941d', weight:5, opacity:.85}).addTo(routeLayer.current);
      leafletMap.current.fitBounds(L.latLngBounds(latlngs), {padding:[40,40]});
    }
  },[routeResult, routeOrigin]);

  return <div id="map" ref={mapRef}></div>;
}

/* ---------- ADDRESS SEARCH MODAL ---------- */
function AddressModal({onClose, onFound}){
  const [q,setQ] = useState("");
  const [loading,setLoading] = useState(false);
  const [error,setError] = useState("");
  const submit = async ()=>{
    if(!q.trim()) return;
    setLoading(true); setError("");
    try{
      const r = await geocodeAddress(q);
      if(r){ onFound(r.lat, r.lng, q); }
      else{ setError("No se encontró esa dirección. Intenta ser más específico (ej. calle + distrito)."); }
    }catch(e){
      setError("No se pudo geocodificar (revisa tu conexión).");
    }
    setLoading(false);
  };
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" style={{maxWidth:400}} onClick={e=>e.stopPropagation()}>
        <div className="modal-header">
          <h3>Buscar por dirección</h3>
          <button onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          <div className="field">
            <label>Dirección o distrito</label>
            <input autoFocus value={q} onChange={e=>setQ(e.target.value)}
              onKeyDown={e=>{ if(e.key==='Enter') submit(); }}
              placeholder="Ej. Av. Javier Prado 123, San Isidro" />
          </div>
          {error && <div style={{color:'#ef4444', fontSize:12}}>{error}</div>}
        </div>
        <div className="modal-footer">
          <button className="btn secondary" onClick={onClose}>Cancelar</button>
          <button className="btn orange" disabled={loading} onClick={submit}>{loading ? 'Buscando...' : 'Buscar'}</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- COORDINATES MODAL (ubicación enviada por el cliente) ---------- */
function parseCoordsInput(raw){
  // Acepta "lat, lng", "lat lng" o campos separados ya parseados
  const cleaned = raw.replace(/[^\d.,\-\s]/g,' ').trim();
  const parts = cleaned.split(/[,\s]+/).filter(Boolean);
  if(parts.length < 2) return null;
  const lat = parseFloat(parts[0]);
  const lng = parseFloat(parts[1]);
  if(isNaN(lat) || isNaN(lng)) return null;
  if(lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;
  return {lat,lng};
}
function CoordsModal({onClose, onFound}){
  const [texto,setTexto] = useState("");
  const [lat,setLat] = useState("");
  const [lng,setLng] = useState("");
  const [error,setError] = useState("");

  const submitTexto = ()=>{
    const r = parseCoordsInput(texto);
    if(!r){ setError("No se pudo leer la ubicación. Pega algo como: -12.0464, -77.0428"); return; }
    onFound(r.lat, r.lng);
  };
  const submitCampos = ()=>{
    const la = parseFloat(lat), ln = parseFloat(lng);
    if(isNaN(la) || isNaN(ln) || la<-90 || la>90 || ln<-180 || ln>180){
      setError("Latitud/Longitud inválidas.");
      return;
    }
    onFound(la, ln);
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" style={{maxWidth:420}} onClick={e=>e.stopPropagation()}>
        <div className="modal-header">
          <h3>Ubicación por coordenadas</h3>
          <button onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          <div className="hint">Útil cuando el cliente te envía su ubicación de WhatsApp/Google Maps.</div>
          <div className="field">
            <label>Pegar coordenadas (lat, lng)</label>
            <input autoFocus value={texto} onChange={e=>setTexto(e.target.value)}
              onKeyDown={e=>{ if(e.key==='Enter') submitTexto(); }}
              placeholder="Ej. -12.0464, -77.0428" />
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8,margin:'2px 0',color:'var(--muted)',fontSize:12}}>
            <div style={{flex:1,height:1,background:'var(--line)'}}></div>o ingresa por separado<div style={{flex:1,height:1,background:'var(--line)'}}></div>
          </div>
          <div className="filters row" style={{padding:0,border:'none'}}>
            <div className="field" style={{flex:1}}>
              <label>Latitud</label>
              <input value={lat} onChange={e=>setLat(e.target.value)} placeholder="-12.0464" />
            </div>
            <div className="field" style={{flex:1}}>
              <label>Longitud</label>
              <input value={lng} onChange={e=>setLng(e.target.value)} placeholder="-77.0428" />
            </div>
          </div>
          {error && <div style={{color:'#ef4444', fontSize:12}}>{error}</div>}
        </div>
        <div className="modal-footer">
          <button className="btn secondary" onClick={onClose}>Cancelar</button>
          <button className="btn orange" onClick={()=>{
            if(texto.trim()) submitTexto(); else submitCampos();
          }}>Usar ubicación</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- MODAL DE RUTA VIAL (clientes seleccionados) ---------- */
function RouteModal({selectedClients, onClose, onRouteReady}){
  const [status, setStatus] = useState('locating'); // locating | loading | ready | error
  const [error, setError] = useState('');
  const [origin, setOrigin] = useState(null);
  const [result, setResult] = useState(null);

  useEffect(()=>{
    if(!navigator.geolocation){
      setStatus('error'); setError('Este navegador no soporta geolocalización.');
      return;
    }
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      const o = {lat: pos.coords.latitude, lng: pos.coords.longitude};
      setOrigin(o);
      setStatus('loading');
      try{
        const r = await fetchOptimizedRoute(o, selectedClients);
        setResult(r);
        setStatus('ready');
        if(onRouteReady) onRouteReady(r, o);
      }catch(e){
        setStatus('error');
        setError(e.message || 'No se pudo calcular la ruta.');
      }
    }, (err)=>{
      setStatus('error');
      setError('No se pudo obtener tu ubicación: ' + err.message);
    }, {enableHighAccuracy:true, timeout:12000});
  },[]);

  const gmapsLink = ()=>{
    if(!origin || !result) return '#';
    const stops = result.orderedStops;
    const destino = stops[stops.length-1];
    const intermedios = stops.slice(0,-1);
    let url = `https://www.google.com/maps/dir/?api=1&origin=${origin.lat},${origin.lng}&destination=${destino.lat},${destino.lng}&travelmode=driving`;
    if(intermedios.length){
      url += `&waypoints=${intermedios.map(s=>`${s.lat},${s.lng}`).join('|')}`;
    }
    return url;
  };
  const wazeLink = ()=>{
    if(!result || !result.orderedStops.length) return '#';
    const primera = result.orderedStops[0];
    return `https://waze.com/ul?ll=${primera.lat},${primera.lng}&navigate=yes`;
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" style={{maxWidth:460}} onClick={e=>e.stopPropagation()}>
        <div className="modal-header">
          <h3>🧭 Ruta para {selectedClients.length} cliente{selectedClients.length!==1?'s':''}</h3>
          <button onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          {status==='locating' && <div className="hint">Obteniendo tu ubicación actual…</div>}
          {status==='loading' && <div className="hint">Calculando la mejor ruta vial…</div>}
          {status==='error' && <div style={{color:'#ef4444', fontSize:13}}>{error}</div>}

          {status==='ready' && result && (
            <React.Fragment>
              <div className="route-total">
                <span>Distancia total</span>
                <span>{result.totalKm.toFixed(1)} km · ~{Math.round(result.totalMin)} min</span>
              </div>
              <div className="route-list">
                {result.orderedStops.map((s,idx)=>{
                  const leg = result.legs[idx]; // tramo que llega a esta parada
                  return (
                    <div className="route-stop" key={s.id}>
                      <div className="num">{idx+1}</div>
                      <div className="body">
                        <div className="nom">{s.nombre}</div>
                        <div className="dist">{s.distrito || ''}</div>
                        <div className="dist">
                          {leg ? `${(leg.distance/1000).toFixed(1)} km desde la parada anterior (~${Math.round(leg.duration/60)} min)` : ''}
                        </div>
                        <div className="action-row" style={{marginTop:6}}>
                          <a className="btn secondary" style={{fontSize:11,padding:'6px 8px'}}
                             target="_blank" rel="noreferrer"
                             href={`https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`}>
                            📍 Maps
                          </a>
                          <a className="btn secondary" style={{fontSize:11,padding:'6px 8px'}}
                             target="_blank" rel="noreferrer"
                             href={`https://waze.com/ul?ll=${s.lat},${s.lng}&navigate=yes`}>
                            🚗 Waze
                          </a>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
              <a className="btn orange" style={{textAlign:'center', textDecoration:'none', display:'block'}}
                 href={gmapsLink()} target="_blank" rel="noreferrer">
                🗺️ Abrir ruta completa (todas las paradas) en Google Maps
              </a>
              <a className="btn secondary" style={{textAlign:'center', textDecoration:'none', display:'block'}}
                 href={wazeLink()} target="_blank" rel="noreferrer">
                🚗 Iniciar en Waze (primera parada: {result.orderedStops[0].nombre})
              </a>
              <div className="hint" style={{textAlign:'center'}}>
                Waze no admite varias paradas en un solo enlace: abre la primera parada y usa el botón "🚗 Waze" de cada cliente para continuar la ruta una por una.
              </div>
            </React.Fragment>
          )}
        </div>
        <div className="modal-footer">
          <button className="btn secondary" onClick={onClose}>Cerrar</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- LOGIN ---------- */
function Login({onLogin}){
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [error, setError] = useState("");
  const [showPass, setShowPass] = useState(false);

  const submit = (e)=>{
    if(e) e.preventDefault();
    const norm = email.trim().toLowerCase();
    const user = USERS.find(u => u.email.toLowerCase()===norm && u.pass===pass);
    if(user){
      setError("");
      onLogin(user.email);
    }else{
      setError("Correo o contraseña incorrectos.");
    }
  };

  return (
    <div className="login-screen">
      <form className="login-card" onSubmit={submit}>
        <img src={LOGO} alt="EDEX" className="login-logo" />
        <h2>CRM Geográfico</h2>
        <p className="login-sub">Ingresa con tu cuenta para continuar</p>
        <label>Usuario</label>
        <input
          type="email"
          autoFocus
          placeholder="correo@edexindustries.com"
          value={email}
          onChange={e=>setEmail(e.target.value)}
        />
        <label>Contraseña</label>
        <div className="login-pass-row">
          <input
            type={showPass ? "text" : "password"}
            placeholder="Contraseña"
            value={pass}
            onChange={e=>setPass(e.target.value)}
          />
          <button type="button" className="login-eye" onClick={()=>setShowPass(s=>!s)} title={showPass?"Ocultar":"Mostrar"}>
            {showPass ? "🙈" : "👁"}
          </button>
        </div>
        {error && <div className="login-error">{error}</div>}
        <button type="submit" className="btn orange login-submit">Ingresar</button>
      </form>
    </div>
  );
}

/* ---------- APP ---------- */
function App({currentUser, onLogout}){
  const [prospectos, setProspectos] = useState([]);
  const [cloudMode, setCloudMode] = useState(db ? 'connecting' : 'local');
  const [view, setView] = useState('mapa');
  const [fabOpen, setFabOpen] = useState(false);
  const [showSidebar, setShowSidebar] = useState(()=> window.innerWidth > 768);
  const [isMobile, setIsMobile] = useState(()=> window.innerWidth <= 768);
  useEffect(()=>{
    const onResize = ()=> setIsMobile(window.innerWidth <= 768);
    window.addEventListener('resize', onResize);
    return ()=> window.removeEventListener('resize', onResize);
  },[]);
  const [pendingPoint, setPendingPoint] = useState(null);
  const [formTarget, setFormTarget] = useState(null); // {id?, lat,lng,...} or null
  const [addressModal, setAddressModal] = useState(false);
  const [coordsModal, setCoordsModal] = useState(false);
  const [selectedId, setSelectedId] = useState(null);
  const [filterEtapa, setFilterEtapa] = useState('');
  const [filterInteres, setFilterInteres] = useState('');
  const [filterResp, setFilterResp] = useState('');

  /* --- planificador de ruta --- */
  const [routeMode, setRouteMode] = useState(false);
  const [selectedRouteIds, setSelectedRouteIds] = useState(()=> new Set());
  const [routeModalOpen, setRouteModalOpen] = useState(false);
  const [routeResult, setRouteResult] = useState(null);
  const [routeOrigin, setRouteOrigin] = useState(null);

  /* --- aviso de reporte mensual --- */
  const [reportBannerVisible, setReportBannerVisible] = useState(()=>{
    if(!isReportDueToday()) return false;
    try{ return localStorage.getItem(reportDismissKey()) !== '1'; }catch(e){ return true; }
  });
  const dismissReportBanner = ()=>{
    try{ localStorage.setItem(reportDismissKey(), '1'); }catch(e){}
    setReportBannerVisible(false);
  };

  /* --- data sync --- */
  useEffect(()=>{
    if(!db){ setProspectos(loadLocal()); setCloudMode('local'); return; }
    let cancelled = false;
    const unsub = db.collection('prospectos').onSnapshot(
      snap=>{
        if(cancelled) return;
        const list = snap.docs.map(d=>({id:d.id, ...d.data()}));
        setProspectos(list);
        setCloudMode('cloud');
      },
      err=>{
        console.warn('Firestore no disponible, usando modo local:', err.message);
        if(cancelled) return;
        setProspectos(loadLocal());
        setCloudMode('local');
      }
    );
    return ()=>{ cancelled = true; unsub(); };
  },[]);

  const persistLocal = (list)=>{ saveLocal(list); setProspectos(list); };

  const createProspect = async (data)=>{
    if(cloudMode==='cloud' && db){
      try{
        await db.collection('prospectos').add({...data, creadoEn: Date.now(), visitas: []});
        return;
      }catch(e){ console.warn('Fallo al guardar en la nube, usando local', e); }
    }
    const list = loadLocal();
    list.push({id: uid(), ...data, creadoEn: Date.now(), visitas: []});
    persistLocal(list);
  };

  const updateProspect = async (id, data)=>{
    if(cloudMode==='cloud' && db){
      try{ await db.collection('prospectos').doc(id).update(data); return; }
      catch(e){ console.warn('Fallo al actualizar en la nube, usando local', e); }
    }
    const list = loadLocal().map(p=> p.id===id ? {...p,...data} : p);
    persistLocal(list);
  };

  const deleteProspect = async (id)=>{
    if(cloudMode==='cloud' && db){
      try{ await db.collection('prospectos').doc(id).delete(); return; }
      catch(e){ console.warn('Fallo al eliminar en la nube, usando local', e); }
    }
    persistLocal(loadLocal().filter(p=>p.id!==id));
  };

  const registrarVisita = async (p)=>{
    const nota = prompt('Nota de la visita (opcional):') || "";
    const responsable = p.responsable && p.responsable!=='Sin asignar' ? p.responsable : (prompt('¿Quién registra la visita?') || 'Sin asignar');
    const visita = {fecha: Date.now(), nota, responsable};
    const visitas = [...(p.visitas||[]), visita];
    await updateProspect(p.id, {visitas});
  };

  /* --- add-prospect flow --- */
  const startFromMapClick = (lat,lng)=>{
    setPendingPoint({lat,lng});
    setFormTarget({lat,lng});
    setFabOpen(false);
  };
  const startFromAddress = ()=>{
    setFabOpen(false);
    setAddressModal(true);
  };
  const onAddressFound = (lat,lng,q)=>{
    setAddressModal(false);
    setPendingPoint({lat,lng});
    setFormTarget({lat,lng, direccion:q});
  };
  const startFromCoords = ()=>{
    setFabOpen(false);
    setCoordsModal(true);
  };
  const onCoordsFound = async (lat,lng)=>{
    setCoordsModal(false);
    setPendingPoint({lat,lng});
    const direccion = await reverseGeocode(lat,lng);
    setFormTarget({lat,lng, direccion});
  };
  const startFromGPS = ()=>{
    setFabOpen(false);
    if(!navigator.geolocation){ alert('Este navegador no soporta geolocalización.'); return; }
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      setPendingPoint({lat,lng});
      const direccion = await reverseGeocode(lat,lng);
      setFormTarget({lat,lng, direccion});
    }, (err)=>{
      alert('No se pudo obtener tu ubicación: ' + err.message);
    }, {enableHighAccuracy:true, timeout:10000});
  };
  const onMapClick = (lat,lng)=>{
    // clicking the map directly also creates a prospect (as requested)
    startFromMapClick(lat,lng);
  };

  const openEdit = (id)=>{
    const p = prospectos.find(x=>x.id===id);
    if(p) setFormTarget(p);
  };
  const closeForm = ()=>{ setFormTarget(null); setPendingPoint(null); };

  const saveForm = async (data)=>{
    if(formTarget && formTarget.id){
      await updateProspect(formTarget.id, data);
    }else{
      await createProspect(data);
    }
    closeForm();
  };
  const deleteFromForm = async (id)=>{
    await deleteProspect(id);
    closeForm();
    if(selectedId===id) setSelectedId(null);
  };

  const filtered = prospectos.filter(p=>
    (!filterEtapa || p.etapa===filterEtapa) &&
    (!filterInteres || p.interes===filterInteres) &&
    (!filterResp || p.responsable===filterResp)
  );

  const selected = prospectos.find(p=>p.id===selectedId);

  /* --- planificador de ruta --- */
  const toggleRouteMode = ()=>{
    setRouteMode(m=>{
      if(m){ setSelectedRouteIds(new Set()); }
      return !m;
    });
  };
  const toggleRouteSelect = (id)=>{
    setSelectedRouteIds(prev=>{
      const next = new Set(prev);
      if(next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };
  const selectedRouteClients = prospectos.filter(p=>
    selectedRouteIds.has(p.id) && typeof p.lat==='number' && typeof p.lng==='number'
  );
  const openRouteModal = ()=>{ if(selectedRouteClients.length>0) setRouteModalOpen(true); };
  const onRouteReady = (result, origin)=>{ setRouteResult(result); setRouteOrigin(origin); };
  const closeRouteModal = ()=> setRouteModalOpen(false);
  const clearRoute = ()=>{ setRouteResult(null); setRouteOrigin(null); setSelectedRouteIds(new Set()); setRouteMode(false); };

  /* --- dashboard data --- */
  const porEtapa = ETAPAS.map(et=>({...et, count: prospectos.filter(p=>p.etapa===et.id).length}));
  const distritos = {};
  prospectos.forEach(p=>{ const d=p.distrito||'Sin distrito'; distritos[d]=(distritos[d]||0)+1; });
  const distritoList = Object.entries(distritos).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxDistrito = Math.max(1, ...distritoList.map(d=>d[1]));

  return (
    <React.Fragment>
      <header>
        <img src={LOGO} alt="EDEX" />
        <span className={"cloud-badge " + (cloudMode==='cloud' ? 'ok':'')}>
          {cloudMode==='cloud' ? '☁ En la nube' : cloudMode==='connecting' ? 'Conectando…' : '💾 Local'}
        </span>
        <div className="tabs">
          <button className={"tab-btn "+(view==='mapa'?'active':'')} onClick={()=>setView('mapa')}>Mapa</button>
          <button className={"tab-btn "+(view==='lista'?'active':'')} onClick={()=>setView('lista')}>Lista</button>
          <button className={"tab-btn "+(view==='dashboard'?'active':'')} onClick={()=>setView('dashboard')}>Dashboard</button>
        </div>
        <div className="spacer"></div>
        <div className="user-badge">
          <span>👤 {currentUser}</span>
          <button onClick={onLogout} title="Cerrar sesión">Salir</button>
        </div>
        <div className="header-tools">
          <select value={filterEtapa} onChange={e=>setFilterEtapa(e.target.value)}>
            <option value="">Todas las etapas</option>
            {ETAPAS.map(et=><option key={et.id} value={et.id}>{et.label}</option>)}
          </select>
          <select value={filterInteres} onChange={e=>setFilterInteres(e.target.value)}>
            <option value="">Todos los intereses</option>
            {INTERESES.map(i=><option key={i.id} value={i.id}>{i.icon} {i.label}</option>)}
          </select>
          <select value={filterResp} onChange={e=>setFilterResp(e.target.value)}>
            <option value="">Todos los responsables</option>
            {RESPONSABLES.map(r=><option key={r} value={r}>{r}</option>)}
          </select>
          <button className={"btn "+(routeMode?"orange":"secondary")} onClick={toggleRouteMode} title="Seleccionar clientes para armar una ruta">
            🧭 {routeMode ? `Seleccionando (${selectedRouteIds.size})` : 'Planificar ruta'}
          </button>
          <button className="btn secondary" onClick={()=>exportProspectosToExcel(prospectos)} title="Descargar toda la información en Excel">
            📊 Exportar Excel
          </button>
        </div>
      </header>

      <main>
        {view==='mapa' && (
          <React.Fragment>
            <div
              className={"sidebar-backdrop" + (showSidebar ? "" : " is-hidden")}
              onClick={()=>setShowSidebar(false)}
            ></div>
            <div className={"sidebar" + (showSidebar ? "" : " is-hidden")}>
              <div className="sidebar-header">
                <h4>Prospectos ({filtered.length}){routeMode && ` · ${selectedRouteIds.size} seleccionados`}</h4>
                <button onClick={()=>setShowSidebar(false)} title="Ocultar lista">×</button>
              </div>
              <div className="prospect-list">
                {filtered.length===0 && <div style={{padding:16,color:'var(--muted)',fontSize:13}}>Sin prospectos todavía. Usa el botón + para agregar el primero.</div>}
                {filtered.map(p=>{
                  const info = etapaInfo(p.etapa);
                  const tinfo = tipoInfo(p.tipo);
                  const hasCoords = typeof p.lat==='number' && typeof p.lng==='number';
                  const checked = selectedRouteIds.has(p.id);
                  return (
                    <div
                      className={"prospect-item " + (routeMode ? "route-mode":"")}
                      key={p.id}
                      onClick={()=>{
                        if(routeMode){ if(hasCoords) toggleRouteSelect(p.id); }
                        else{ setSelectedId(p.id); }
                      }}
                    >
                      {routeMode && (
                        <div className={"route-checkbox "+(checked?"checked":"")} title={hasCoords ? '' : 'Sin ubicación en el mapa'}>
                          {checked ? '✓' : ''}
                        </div>
                      )}
                      <div className="info">
                        <div className="nombre">
                          <span style={{color:tinfo.color}}>{tinfo.icon}</span> {interesIcon(p.interes)} {p.nombre}
                        </div>
                        <div className="meta">{p.distrito || p.direccion || 'Sin dirección'}{!hasCoords && routeMode ? ' (sin ubicación)':''}</div>
                        <span className="pill" style={{background:info.color+'33', color:info.color}}>{info.label}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
              {routeMode && (
                <div className="route-sidebar-footer">
                  <button
                    className="btn orange"
                    disabled={selectedRouteIds.size===0}
                    onClick={openRouteModal}
                  >
                    🧭 Calcular ruta ({selectedRouteIds.size})
                  </button>
                  <div className="hint2">
                    {selectedRouteIds.size===0
                      ? 'Marca los clientes que quieras visitar'
                      : 'Se ordenarán según cercanía real por calles'}
                  </div>
                </div>
              )}
            </div>
            <div style={{flex:1, position:'relative', zIndex:1, isolation:'isolate'}}>
              {!showSidebar && (
                <button className="sidebar-toggle-pill" onClick={()=>setShowSidebar(true)}>
                  ☰ Prospectos ({filtered.length})
                </button>
              )}
              {reportBannerVisible && (
                <div className="report-banner">
                  📋 Hoy corresponde enviar el reporte mensual del estado de clientes.
                  <button className="rb-send" onClick={()=>{ exportProspectosToExcel(prospectos); dismissReportBanner(); }}>Exportar y enviar</button>
                  <button className="rb-dismiss" onClick={dismissReportBanner}>Ya lo envié</button>
                </div>
              )}
              {pendingPoint && !formTarget && (
                <div className="pending-note">Toca el mapa para ubicar el prospecto</div>
              )}
              <MapView
                prospectos={filtered}
                onMapClick={onMapClick}
                pendingPoint={pendingPoint}
                selectedId={selectedId}
                onSelect={openEdit}
                resizeSignal={showSidebar}
                routeResult={routeResult}
                routeOrigin={routeOrigin}
              />
              {routeMode && selectedRouteIds.size>0 && !showSidebar && (
                <button className="route-fab" onClick={openRouteModal}>
                  🧭 Calcular ruta ({selectedRouteClients.length})
                </button>
              )}
              {!routeMode && routeResult && (
                <button className="route-fab" onClick={clearRoute}>
                  ✕ Quitar ruta del mapa
                </button>
              )}
              <div className="fab-add">
                {fabOpen && (
                  <div className="fab-menu">
                    <button onClick={()=>{ setFabOpen(false); alert('Toca cualquier punto del mapa para ubicar el nuevo prospecto.'); }}>
                      📍 Tocar el mapa
                    </button>
                    <button onClick={startFromAddress}>✍️ Escribir dirección / distrito</button>
                    <button onClick={startFromCoords}>🎯 Ingresar coordenadas (cliente)</button>
                    <button onClick={startFromGPS}>🧭 Usar mi ubicación (GPS)</button>
                  </div>
                )}
                <button className="fab-main" onClick={()=>setFabOpen(o=>!o)}>{fabOpen ? '×' : '+'}</button>
              </div>
            </div>
          </React.Fragment>
        )}

        {view==='lista' && (
          <div className="list-view">
            <table className="list-table">
              <thead>
                <tr><th></th><th>Nombre</th><th>Distrito</th><th>Etapa</th><th>Responsable</th><th>Próxima acción</th><th>Visitas</th></tr>
              </thead>
              <tbody>
                {filtered.map(p=>{
                  const info = etapaInfo(p.etapa);
                  return (
                    <tr key={p.id} onClick={()=>openEdit(p.id)}>
                      <td>{interesIcon(p.interes)}</td>
                      <td>{p.nombre}</td>
                      <td>{p.distrito || '—'}</td>
                      <td><span className="pill" style={{background:info.color+'33', color:info.color}}>{info.label}</span></td>
                      <td>{p.responsable || '—'}</td>
                      <td>{p.proximaAccion || '—'}</td>
                      <td>{(p.visitas||[]).length}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}

        {view==='dashboard' && (
          <div className="dashboard">
            <div className="cards">
              <div className="card"><div className="num">{prospectos.length}</div><div className="lbl">Prospectos totales</div></div>
              {porEtapa.map(et=>(
                <div className="card" key={et.id}>
                  <div className="num" style={{color:et.color}}>{et.count}</div>
                  <div className="lbl">{et.label}</div>
                </div>
              ))}
            </div>
            <div className="dash-block">
              <h4>Top distritos</h4>
              {distritoList.length===0 && <div style={{color:'var(--muted)',fontSize:13}}>Sin datos aún.</div>}
              {distritoList.map(([d,count])=>(
                <div className="bar-row" key={d}>
                  <div className="bar-lbl">{d}</div>
                  <div className="bar-track"><div className="bar-fill" style={{width:(count/maxDistrito*100)+'%'}}></div></div>
                  <div className="bar-num">{count}</div>
                </div>
              ))}
            </div>
          </div>
        )}
      </main>

      {selected && !formTarget && (
        <div className="modal-backdrop" onClick={()=>setSelectedId(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">
              <h3>{interesIcon(selected.interes)} {selected.nombre}</h3>
              <button onClick={()=>setSelectedId(null)}>×</button>
            </div>
            <div className="modal-body">
              <div>{selected.direccion}{selected.distrito ? ', '+selected.distrito : ''}</div>
              <span className="pill" style={{background:etapaInfo(selected.etapa).color+'33', color:etapaInfo(selected.etapa).color}}>
                {etapaInfo(selected.etapa).label}
              </span>
              <div className="hint">Responsable: {selected.responsable || 'Sin asignar'}</div>
              {selected.proximaAccion && <div className="hint">Próxima acción: {selected.proximaAccion}</div>}
              {selected.notas && <div style={{fontSize:13, marginTop:6}}>{selected.notas}</div>}

              <div className="action-row">
                {typeof selected.lat==='number' && (
                  <React.Fragment>
                    <a className="btn secondary" target="_blank" rel="noreferrer"
                       href={`https://www.google.com/maps/search/?api=1&query=${selected.lat},${selected.lng}`}>Google Maps</a>
                    <a className="btn secondary" target="_blank" rel="noreferrer"
                       href={`https://waze.com/ul?ll=${selected.lat},${selected.lng}&navigate=yes`}>Waze</a>
                  </React.Fragment>
                )}
              </div>
              <button className="btn orange" onClick={()=>registrarVisita(selected)}>Registrar visita</button>

              {(selected.visitas||[]).length>0 && (
                <div className="field">
                  <label>Historial de visitas</label>
                  {selected.visitas.slice().reverse().map((v,idx)=>(
                    <div className="visit-item" key={idx}>
                      <div className="fecha">{fmtDate(v.fecha)} — {v.responsable}</div>
                      {v.nota && <div>{v.nota}</div>}
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div className="modal-footer">
              <button className="btn danger" onClick={()=>{
                if(confirm('¿Eliminar este prospecto del mapa?')){ deleteProspect(selected.id); setSelectedId(null); }
              }}>Eliminar pin</button>
              <button className="btn secondary" onClick={()=>{ setFormTarget(selected); }}>Editar</button>
              <button className="btn secondary" onClick={()=>setSelectedId(null)}>Cerrar</button>
            </div>
          </div>
        </div>
      )}

      {formTarget && (
        <ProspectForm
          initial={formTarget}
          onClose={closeForm}
          onSave={saveForm}
          onDelete={deleteFromForm}
        />
      )}

      {addressModal && (
        <AddressModal onClose={()=>setAddressModal(false)} onFound={onAddressFound} />
      )}

      {coordsModal && (
        <CoordsModal onClose={()=>setCoordsModal(false)} onFound={onCoordsFound} />
      )}

      {routeModalOpen && (
        <RouteModal
          selectedClients={selectedRouteClients}
          onClose={closeRouteModal}
          onRouteReady={onRouteReady}
        />
      )}
    </React.Fragment>
  );
}

function AuthGate(){
  const [currentUser, setCurrentUser] = useState(()=>{
    try{ return localStorage.getItem(AUTH_KEY) || null; }catch(e){ return null; }
  });

  const handleLogin = (email)=>{
    try{ localStorage.setItem(AUTH_KEY, email); }catch(e){}
    setCurrentUser(email);
  };
  const handleLogout = ()=>{
    try{ localStorage.removeItem(AUTH_KEY); }catch(e){}
    setCurrentUser(null);
  };

  if(!currentUser){
    return <Login onLogin={handleLogin} />;
  }
  return <App currentUser={currentUser} onLogout={handleLogout} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<AuthGate />);
</script>
</body>
</html>
